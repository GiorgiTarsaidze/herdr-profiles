name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: herdr-profiles-linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: herdr-profiles-linux-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: herdr-profiles-darwin-amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: herdr-profiles-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check version matches tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "herdr-plugin.toml version $v != tag ${GITHUB_REF_NAME}"; exit 1; }
          c=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$c" = "$v" ] || { echo "Cargo.toml version $c != $v"; exit 1; }
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/herdr-profiles dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum herdr-profiles-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
