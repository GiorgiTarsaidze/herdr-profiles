[package]
name = "herdr-profiles"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Chrome-style profiles for Herdr: isolated sets of spaces with a popup chooser"
repository = "https://github.com/GiorgiTarsaidze/herdr-profiles"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
